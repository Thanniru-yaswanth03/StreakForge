services:
  mongodb:
    image: mongo:7.0
    container_name: streakforge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: streakforge
    volumes:
      - mongo_data:/data/db
    networks:
      - streakforge-net

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: streakforge-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/streakforge
      JWT_SECRET: ${JWT_SECRET:-insecure_dev_jwt_secret_must_change_in_prod_at_least_32_chars}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:4000/api/v1/auth/github/callback}
      CORS_ORIGIN: "http://localhost:3000,chrome-extension://*"
      WEB_APP_URL: "http://localhost:3000"
    depends_on:
      - mongodb
    networks:
      - streakforge-net

  web:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: streakforge-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - api
    networks:
      - streakforge-net

networks:
  streakforge-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local

